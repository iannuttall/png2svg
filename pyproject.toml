[project]
name = "png2svg"
version = "0.2.0"
description = "Deterministic measurement and SVG reconstruction tools for the png2svg skill"
readme = "README.md"
authors = [
    { name = "ian nuttall", email = "6681919+iannuttall@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "resvg-py>=0.3.3",
    "scipy>=1.18.0",
    "typer>=0.26.8",
]

[project.scripts]
png2svg = "png2svg.cli:app"

[tool.uv.build-backend]
# the package lives inside the skill so the skill is self-contained; this
# repo's pyproject exists for local dev (tests, editable CLI) only
module-root = "skills/png2svg/scripts"
module-name = "png2svg"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
